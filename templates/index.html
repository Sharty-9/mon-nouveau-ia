<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon IA Perso</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #343541; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 15px; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: #0b93f6; border-bottom-right-radius: 2px; }
        .assistant { align-self: flex-start; background: #444654; border-bottom-left-radius: 2px; }
        #input-area { background: #40414f; padding: 20px; display: flex; gap: 10px; border-top: 1px solid #4d4d4f; }
        input { flex: 1; background: #40414f; border: 1px solid #565869; color: white; padding: 12px; border-radius: 5px; outline: none; }
        button { background: #10a37f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #2a2b32; cursor: not-allowed; }
    </style>
</head>
<body>

<div id="chat-container">
    <div class="message assistant">Bonjour ! Posez-moi une question.</div>
</div>

<div id="input-area">
    <input type="text" id="userInput" placeholder="Envoyez un message..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">Envoyer</button>
</div>

<script>
    const container = document.getElementById("chat-container");
    const input = document.getElementById("userInput");
    const btn = document.getElementById("sendBtn");

    function addMsg(role, text) {
        const div = document.createElement("div");
        div.className = `message ${role}`;
        div.innerText = text;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        input.disabled = true;
        btn.disabled = true;
        addMsg("user", text);

        try {
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            addMsg("assistant", data.response || "Erreur: " + data.error);
        } catch (e) {
            addMsg("assistant", "Erreur de connexion au serveur.");
        } finally {
            input.disabled = false;
            btn.disabled = false;
            input.focus();
        }
    }

    input.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
