<style>
    .preview-container { display: none; padding: 10px; background: #222; border-top: 1px solid #333; }
    #image-preview { max-height: 100px; border-radius: 8px; }
    .btn-file { background: #333; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
</style>

<div class="preview-container" id="p-container">
    <img id="image-preview" src="">
    <button onclick="clearImage()" style="background:red; width:20px; height:20px; border-radius:50%; font-size:10px;">X</button>
</div>

<div class="input-area">
    <label class="btn-file">
        + <input type="file" id="file-input" accept="image/*" hidden onchange="previewFile()">
    </label>
    <input type="text" id="user-input" placeholder="Décrivez l'image ou demandez..." autocomplete="off">
    <button onclick="sendMessage()">➤</button>
</div>

<script>
    let currentImageBase64 = null;

    function previewFile() {
        const file = document.getElementById('file-input').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            currentImageBase64 = reader.result;
            document.getElementById('image-preview').src = reader.result;
            document.getElementById('p-container').style.display = 'block';
        }
        if (file) reader.readAsDataURL(file);
    }

    function clearImage() {
        currentImageBase64 = null;
        document.getElementById('p-container').style.display = 'none';
        document.getElementById('file-input').value = "";
    }

    async function sendMessage() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text && !currentImageBase64) return;

        appendMessage(text || "Image envoyée", 'user');
        
        const formData = new URLSearchParams();
        formData.append('msg', text);
        if (currentImageBase64) formData.append('image', currentImageBase64);

        input.value = '';
        clearImage();

        try {
            const response = await fetch('/get_response', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: formData
            });
            const data = await response.json();
            appendMessage(data.reply, 'ai');
        } catch (e) {
            appendMessage("Erreur de connexion...", 'ai');
        }
    }
    // ... (Gardez votre fonction appendMessage précédente)
</script>
